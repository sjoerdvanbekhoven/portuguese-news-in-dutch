name: Nieuws genereren

on:
  schedule:
    # 05:17 en 16:17 UTC = 05:17 / 16:17 in Portugal in de winter (WET = UTC), 06:17 / 17:17 in de zomer.
    # GitHub start geplande runs vaak 5-30 min later dan opgegeven.
    - cron: "17 5,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Editie genereren
        run: npm run generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_MODEL: ${{ vars.NEWS_MODEL }}
          NEWS_EFFORT: ${{ vars.NEWS_EFFORT }}

      - name: Committen en pushen
        run: |
          git config user.name "nieuws-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/editions
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
            exit 0
          fi
          git commit -m "Editie $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
