name: Nieuws genereren

on:
  # Alleen extern gestart: cron-job.org roept deze workflow aan (zie README), of handmatig via
  # "Run workflow". Er is bewust geen GitHub-schema meer.
  workflow_dispatch:
    inputs:
      force:
        description: "Ook genereren als er al een recente editie is"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Editie genereren
        run: npm run generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_MODEL: ${{ vars.NEWS_MODEL }}
          NEWS_EFFORT: ${{ vars.NEWS_EFFORT }}
          NEWS_FORCE: ${{ inputs.force }}

      - name: Committen en pushen
        run: |
          git config user.name "nieuws-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/editions
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
            exit 0
          fi
          git commit -m "Editie $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
